name: 버그 보고
description: 재현 가능한 오류와 기대 동작을 기록합니다.
title: "[BUG] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 어떤 문제가 발생했는지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 문제를 다시 확인할 수 있는 최소 절차를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: 브랜치, commit, 기기, OS와 앱 버전 등 필요한 정보를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 수정 범위와 제외 범위
      description: 예상 수정 범위와 함께 수정하지 않을 관련 영역을 적어 주세요.
  - type: textarea
    id: tests
    attributes:
      label: 회귀 테스트 방법
      description: 수정 후 실행할 테스트와 수동 확인을 적어 주세요.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 확인
      options:
        - label: 로그와 스크린샷에서 비밀정보와 개인정보를 제거했습니다.
          required: true
