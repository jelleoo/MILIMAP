name: 기능 요청
description: 사용자 기능 또는 제품 동작을 Issue 단위로 정의합니다.
title: "[FEATURE] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 해결하려는 사용자 또는 제품 문제를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이 Issue가 완료됐을 때 달성되어야 하는 결과를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 이번 Issue에 포함할 작업을 나열해 주세요.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 작업하지 않을 범위
      description: 관련 있어 보이지만 이번 Issue에서는 다루지 않을 내용을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: expected_files
    attributes:
      label: 예상 변경 파일
      description: 알고 있다면 예상 경로나 모듈을 적어 주세요.
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 리뷰어가 완료 여부를 판단할 수 있는 조건을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: 테스트 방법
      description: 실행할 자동 테스트와 수동 확인 방법을 적어 주세요.
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: 의존 Issue
      description: 선행 또는 연관 Issue 번호가 있으면 적어 주세요.
  - type: input
    id: owner_reviewer
    attributes:
      label: 담당자와 리뷰어
      description: 제안하는 담당자와 교차 리뷰어를 적어 주세요.
  - type: checkboxes
    id: safety
    attributes:
      label: 확인
      options:
        - label: 비밀정보나 개인정보를 Issue 본문에 포함하지 않았습니다.
          required: true
