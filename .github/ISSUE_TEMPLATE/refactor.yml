name: 리팩터링
description: 사용자 동작을 유지하는 구조 개선을 정의합니다.
title: "[REFACTOR] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 현재 문제
      description: 현재 구조가 만드는 구체적인 유지보수 또는 검증 문제를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목표 구조
      description: 변경 후 책임과 의존 방향을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 작업하지 않을 범위
      description: 기능 추가, 디자인 변경 등 함께 넣지 않을 내용을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 호환성과 데이터 영향
      description: 사용자 동작, DB, API, Migration 영향이 있는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: 회귀 방지 검증
      description: 동작이 바뀌지 않았음을 확인할 테스트를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 위험과 되돌리기 방법
    validations:
      required: true
  - type: checkboxes
    id: agreement
    attributes:
      label: 확인
      options:
        - label: 요청하지 않은 제품 기능을 함께 변경하지 않습니다.
          required: true
        - label: 필요한 아키텍처 결정은 ADR 상태와 팀 승인을 확인했습니다.
          required: true
