name: Android CI

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "data/**"
      - "tools/data/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches: [main, dev]
    paths:
      - "apps/android/**"
      - "data/**"
      - "tools/data/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

jobs:
  verify-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Verify canonical data pipeline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -LiteralPath tools/data -Filter 'test-*.ps1' |
            Sort-Object Name |
            ForEach-Object { & $_.FullName }

  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Verify Gradle daemon JDK 17 contract
        shell: bash
        run: |
          gradle_version="$(./gradlew --version)"
          printf '%s\n' "$gradle_version"
          grep -Eq '^Daemon JVM:.*Java 17' <<< "$gradle_version"

      - name: Assemble and run unit tests
        run: ./gradlew assembleDebugUnitTest testDebugUnitTest --stacktrace

      - name: Lint and build debug APK
        run: ./gradlew lintDebug assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: military-benefit-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
