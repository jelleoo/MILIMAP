name: Deploy Ops Web

on:
  pull_request:
    branches: [dev]
    paths:
      - "apps/ops-web/**"
      - "apps/android/app/src/main/assets/benefits.seed.manifest.json"
      - "tools/data/build-ops-dashboard-snapshot.ps1"
      - "tools/data/test-build-ops-dashboard-snapshot.ps1"
      - ".github/workflows/deploy-ops-web.yml"
  push:
    branches: [dev]
    paths:
      - "apps/ops-web/**"
      - "apps/android/app/src/main/assets/benefits.seed.manifest.json"
      - "tools/data/build-ops-dashboard-snapshot.ps1"
      - "tools/data/test-build-ops-dashboard-snapshot.ps1"
      - ".github/workflows/deploy-ops-web.yml"
  workflow_dispatch:
    inputs:
      include_live_drift:
        description: "Include live weekly official source drift check in ops-snapshot.json"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-ops-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ops-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/ops-web/package-lock.json

      - name: Install, typecheck, test, and build ops-web
        working-directory: apps/ops-web
        run: |
          npm ci
          npm run typecheck
          npm run test
          npm run build

      - name: Verify ops snapshot builder script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & tools/data/test-build-ops-dashboard-snapshot.ps1

  deploy-ops-web:
    needs: verify-ops-web
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check Cloudflare Pages secrets
        id: cf
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Cloudflare Pages 자동 배포 대기 중"
              echo ""
              echo "\`CLOUDFLARE_API_TOKEN\` 또는 \`CLOUDFLARE_ACCOUNT_ID\` GitHub Secret이 아직 설정되지 않아 배포를 건너뛰었습니다."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "ERROR: Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret." >&2
              exit 1
            fi
          fi

      - name: Checkout
        if: steps.cf.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        if: steps.cf.outputs.configured == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/ops-web/package-lock.json

      - name: Refresh ops-snapshot.json
        if: steps.cf.outputs.configured == 'true'
        shell: pwsh
        env:
          INCLUDE_LIVE_DRIFT: ${{ github.event_name == 'workflow_dispatch' && inputs.include_live_drift }}
          DRIFT_DIR: ${{ runner.temp }}/ops-drift
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INCLUDE_LIVE_DRIFT -eq 'true') {
            & tools/data/run-weekly-benefit-drift-check.ps1 -OutputDirectory $env:DRIFT_DIR | Out-Null
            $driftJson = Join-Path $env:DRIFT_DIR 'weekly-drift-summary.json'
            & tools/data/build-ops-dashboard-snapshot.ps1 `
              -WeeklyDriftSummaryJson $driftJson `
              -OutputJson 'apps/ops-web/public/ops-snapshot.json' | Out-Null
          } else {
            & tools/data/build-ops-dashboard-snapshot.ps1 `
              -OutputJson 'apps/ops-web/public/ops-snapshot.json' | Out-Null
          }

      - name: Install dependencies and build production bundle
        if: steps.cf.outputs.configured == 'true'
        working-directory: apps/ops-web
        run: |
          npm ci
          npm run build

      - name: Deploy dist to Cloudflare Pages
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/ops-web
          command: pages deploy dist --project-name=milimap-ops-web --branch=main --commit-dirty=true
